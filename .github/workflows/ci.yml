name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify pinned Go patch
        shell: bash
        run: test "$(go env GOVERSION)" = "$(awk '/^toolchain / {print $2}' go.mod)"
      - name: Format, vet and test
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -count=1 ./...
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Check CLI on Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CGO_ENABLED = '0'
          $binary = Join-Path $env:RUNNER_TEMP 'afa.exe'
          go build -trimpath -o $binary ./cmd/afa
          & $binary version
          & $binary portal --help
      - name: Scan Go source for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  package:
    name: Reproduce and validate Windows artifacts
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Test, build twice and compare
        run: |
          python -B -m unittest discover -s scripts -p 'test_*.py'
          python scripts/package.py --out "$RUNNER_TEMP/afa-dist"
          python scripts/package.py --out "$RUNNER_TEMP/afa-rebuild"
          diff -r "$RUNNER_TEMP/afa-dist" "$RUNNER_TEMP/afa-rebuild"
          python scripts/package.py --verify "$RUNNER_TEMP/afa-dist"
      - name: Scan Windows executables for known vulnerabilities
        run: |
          python - "$RUNNER_TEMP/afa-dist" "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          package = next(Path(sys.argv[1]).glob('*-windows-x64.zip'))
          with zipfile.ZipFile(package) as archive:
              for name in ('afa.exe', 'AFA-Desktop.exe'):
                  (Path(sys.argv[2]) / name).write_bytes(archive.read(name))
          PY
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -mode=binary "$RUNNER_TEMP/afa.exe"
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -mode=binary "$RUNNER_TEMP/AFA-Desktop.exe"
      - name: Stage artifacts after manual workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afa-windows-x64-review
          path: ${{ runner.temp }}/afa-dist/*
          if-no-files-found: error
          retention-days: 14
